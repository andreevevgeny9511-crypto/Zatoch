<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Заточка в Кемерово — 20 декабря</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Заточка" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Dynamic PNG icon generation for iOS -->
    <script>
      (function() {
        function generatePNGIcon() {
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
            '<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" style="stop-color:#1a0533"/><stop offset="50%" style="stop-color:#2d1b69"/>' +
            '<stop offset="100%" style="stop-color:#0f0520"/></linearGradient>' +
            '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#f59e0b"/>' +
            '</linearGradient></defs>' +
            '<rect width="512" height="512" rx="96" fill="url(#bg)"/>' +
            '<g transform="translate(256,280)">' +
            '<ellipse cx="0" cy="30" rx="70" ry="85" fill="url(#g)" opacity="0.9"/>' +
            '<ellipse cx="0" cy="-30" rx="50" ry="60" fill="url(#g)" opacity="0.9"/>' +
            '<circle cx="0" cy="30" r="18" fill="#1a0533"/>' +
            '<rect x="-8" y="-180" width="16" height="160" rx="4" fill="url(#g)" opacity="0.9"/>' +
            '<rect x="-14" y="-210" width="28" height="35" rx="6" fill="url(#g)" opacity="0.9"/>' +
            '</g></svg>';

          var canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          var ctx = canvas.getContext('2d');
          var img = new Image();
          var blob = new Blob([svg], {type: 'image/svg+xml'});
          var url = URL.createObjectURL(blob);

          img.onload = function() {
            ctx.drawImage(img, 0, 0, 180, 180);
            URL.revokeObjectURL(url);
            var pngUrl = canvas.toDataURL('image/png');

            // Set as apple-touch-icon
            var link = document.querySelector('link[rel="apple-touch-icon"]');
            if (link) {
              link.setAttribute('href', pngUrl);
              link.setAttribute('type', 'image/png');
            }

            // Also create additional sizes
            [152, 167, 180].forEach(function(size) {
              var c = document.createElement('canvas');
              c.width = size;
              c.height = size;
              var cx = c.getContext('2d');
              cx.drawImage(img, 0, 0, size, size);
              var l = document.createElement('link');
              l.rel = 'apple-touch-icon';
              l.sizes = size + 'x' + size;
              l.href = c.toDataURL('image/png');
              document.head.appendChild(l);
            });
          };
          img.src = url;
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', generatePNGIcon);
        } else {
          generatePNGIcon();
        }
      })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f0520;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SW registered:', reg.scope);
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
